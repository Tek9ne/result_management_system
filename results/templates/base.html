{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>{% block title %}Result Management System{% endblock %}</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="{% static 'images/favicon.ico' %}"
    />
    <link rel="apple-touch-icon" href="{% static 'images/favicon.ico' %}" />
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #d5e1e9, #a3bffa);
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .dashboard {
        background-color: white;
        padding: 2rem;
        border-radius: 15px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        width: 90%;
        max-width: 900px;
        text-align: center;
        box-sizing: border-box;
      }
      h1 {
        color: #1a2a44;
        font-size: 2rem;
        margin-bottom: 1rem;
      }
      button {
        padding: 0.7rem 1.5rem;
        background: linear-gradient(45deg, #2980b9, #2c3e50);
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1rem;
      }
      button:hover {
        background: linear-gradient(45deg, #2c3e50, #2980b9);
      }
      a {
        color: #2980b9;
        text-decoration: none;
        margin-left: 1rem;
        font-size: 1rem;
      }
      a:hover {
        color: #1a5276;
      }
      @media (max-width: 600px) {
        .dashboard {
          padding: 1rem;
          width: 95%;
        }
        h1 {
          font-size: 1.5rem;
        }
        button,
        a {
          font-size: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    {% block content %} {% endblock %}
  </body>
</html>
