{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Delete Score</title>
    <style>
      body {
        background-color: #1a1a2e;
        color: #ffd700;
        font-family: Arial;
      }
      .container {
        max-width: 400px;
        margin: 50px auto;
        padding: 20px;
        background: #16213e;
        border-radius: 10px;
      }
      form {
        margin: 10px 0;
      }
      button {
        padding: 5px 10px;
        background: #ff6f91;
        color: #fff;
        border: none;
        border-radius: 3px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Confirm Delete</h2>
      <form method="post">
        {% csrf_token %}
        <p>Are you sure you want to delete this score?</p>
        <button type="submit">Yes</button>
        <a href="{% url 'teacher_home' %}">No</a>
      </form>
    </div>
  </body>
</html>
