<!DOCTYPE html>
<html>
  <head>
    <title>Reset Admin Password</title>
  </head>
  <body>
    <h1>Reset Password for {{ admin_username }}</h1>
    {% if error %}
    <p style="color: red">{{ error }}</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <label for="new_password">New Password:</label>
      <input
        type="password"
        id="new_password"
        name="new_password"
        required
      /><br />
      <label for="confirm_password">Confirm Password:</label>
      <input
        type="password"
        id="confirm_password"
        name="confirm_password"
        required
      /><br />
      <button type="submit">Reset Password</button>
    </form>
  </body>
</html>
