{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add Student</title>
    <style>
      body {
        background-color: #1a1a2e;
        color: #ffd700;
        font-family: Arial;
      }
      .container {
        max-width: 400px;
        margin: 50px auto;
        padding: 20px;
        background: #16213e;
        border-radius: 10px;
      }
      .timestamp {
        font-size: 0.9rem;
        color: #ccc;
        margin-bottom: 10px;
      }
      input,
      select,
      textarea,
      button {
        margin: 10px 0;
        padding: 8px;
        width: 100%;
        box-sizing: border-box;
      }
      input[type="file"] {
        padding: 5px 0;
      }
      input[type="file"]::file-selector-button {
        background: #e94560;
        color: #fff;
        border: none;
        padding: 6px 12px;
        border-radius: 3px;
        cursor: pointer;
        transition: background 0.3s;
      }
      input[type="file"]::file-selector-button:hover {
        background: #d13f55;
      }
      select[multiple] {
        height: 100px;
      }
      button {
        background: #e94560;
        color: #fff;
        border: none;
        border-radius: 3px;
        cursor: pointer;
        padding: 10px;
        transition: background 0.3s;
      }
      button:hover {
        background: #d13f55;
      }
      textarea {
        resize: vertical;
        min-height: 60px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Add Student</h2>
      <div class="timestamp">Last Updated: August 01, 2025 03:54 PM CEST</div>
      {% if error %}
      <p style="color: #ff6f91">{{ error }}</p>
      {% endif %}
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input
          type="text"
          name="school_code"
          placeholder="School Code"
          required
        />
        <input
          type="text"
          name="admission_number"
          placeholder="Admission Number"
          required
        />
        <input type="text" name="full_name" placeholder="Full Name" required />
        <input
          type="text"
          name="roll_number"
          placeholder="Roll Number"
          required
        />
        <input
          type="text"
          name="phone_number"
          placeholder="Phone Number (e.g., 234XXXXXXXXXX)"
          required
        />
        <textarea
          name="home_address"
          placeholder="Home Address"
          required
        ></textarea>
        <label for="avatar">Upload Image:</label>
        <input
          type="file"
          name="avatar"
          id="avatar"
          accept="image/*"
          required
        />
        <select name="department" required>
          <option value="">Select Section</option>
          <option value="1">Tech 1</option>
          <option value="2">Tech 2</option>
          <option value="3">Tech 3</option>
        </select>
        <select name="class" required>
          <option value="">Select Class</option>
          {% for cls in classes %}
          <option value="{{ cls.id }}">{{ cls.name }}</option>
          {% endfor %}
        </select>
        <select name="subjects" multiple>
          {% for subject in subjects %}
          <option value="{{ subject.id }}">{{ subject.name }}</option>
          {% endfor %}
        </select>
        <button type="submit">Add Student</button>
      </form>
      <a href="{% url 'results:admin_dashboard' %}">Back</a>
    </div>
  </body>
</html>
