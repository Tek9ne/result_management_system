<!DOCTYPE html>
<html>
  <head>
    <title>Upload Scores</title>
  </head>
  <body>
    <h1>Upload Scores</h1>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <input
        type="file"
        name="excel_file"
        accept=".xlsx, .xls"
        required
      /><br />
      <button type="submit">Upload</button>
    </form>
  </body>
</html>
