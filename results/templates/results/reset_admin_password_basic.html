{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reset Admin Password</title>
    <style>
      body {
        background-color: #1a1a2e;
        color: #ffd700;
        font-family: Arial, sans-serif;
      }
      .container {
        max-width: 400px;
        margin: 50px auto;
        padding: 20px;
        background: #16213e;
        border-radius: 10px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
      }
      input {
        padding: 8px;
        width: 100%;
        border: 1px solid #e94560;
        border-radius: 4px;
        background: #1a1a2e;
        color: #ffd700;
      }
      button {
        padding: 10px 20px;
        background: #e94560;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Reset Password for {{ admin_username }}</h2>
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label for="new_password">New Password:</label>
          <input
            type="password"
            id="new_password"
            name="new_password"
            required
          />
        </div>
        <button type="submit">Reset Password</button>
      </form>
      <a href="{% url 'admin_home' %}">Back</a>
    </div>
  </body>
</html>
