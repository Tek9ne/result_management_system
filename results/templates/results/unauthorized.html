{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unauthorized - Result Management System</title>
    <style>
      body {
        background: linear-gradient(135deg, #1a1a2e, #0f3460);
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .unauthorized-container {
        background: rgba(22, 33, 62, 0.9);
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        text-align: center;
        max-width: 400px;
        width: 100%;
        position: relative;
        animation: shieldGlow 3s infinite ease-in-out;
      }
      @keyframes shieldGlow {
        0% {
          box-shadow: 0 0 10px #e94560;
        }
        50% {
          box-shadow: 0 0 20px #ff6f91, 0 0 30px #ffd700;
        }
        100% {
          box-shadow: 0 0 10px #e94560;
        }
      }
      h1 {
        color: #ffd700;
        text-shadow: 0 0 10px #e94560;
        margin-bottom: 20px;
      }
      .timestamp {
        font-size: 0.85rem;
        color: #ccc;
        margin-bottom: 15px;
      }
      .error {
        color: #ff6f91;
        margin-bottom: 20px;
      }
      a {
        color: #e94560;
        text-decoration: none;
        padding: 10px;
        border: 2px solid #e94560;
        border-radius: 5px;
        transition: all 0.3s;
      }
      a:hover {
        color: #ff6f91;
        border-color: #ff6f91;
        background: rgba(255, 111, 145, 0.1);
      }
      @media (max-width: 480px) {
        .unauthorized-container {
          padding: 20px;
        }
        h1 {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="unauthorized-container">
      <h1>Unauthorized Access</h1>
      <div class="timestamp">Last Updated: August 02, 2025 05:14 PM CEST</div>
      {% if error %}
      <p class="error">{{ error }}</p>
      {% endif %}
      <a href="{% url 'results:login' %}">Return to Login</a>
    </div>
  </body>
</html>
