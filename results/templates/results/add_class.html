{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add Class</title>
    <style>
      body {
        background-color: #1a1a2e;
        color: #ffd700;
        font-family: Arial;
      }
      .container {
        max-width: 400px;
        margin: 50px auto;
        padding: 20px;
        background: #16213e;
        border-radius: 10px;
      }
      input,
      button {
        margin: 10px 0;
        padding: 5px;
      }
      button {
        background: #e94560;
        color: #fff;
        border: none;
        border-radius: 3px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Add Class</h2>
      {% if error %}
      <p style="color: #ff6f91">{{ error }}</p>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <input
          type="text"
          name="name"
          placeholder="Enter Class Name"
          required
        />
        <button type="submit">Add Class</button>
      </form>
      <a href="{% url 'results:admin_dashboard' %}">Back</a>
    </div>
  </body>
</html>
