{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edit Score</title>
    <style>
      body {
        background-color: #1a1a2e;
        color: #ffd700;
        font-family: Arial;
      }
      .container {
        max-width: 400px;
        margin: 50px auto;
        padding: 20px;
        background: #16213e;
        border-radius: 10px;
      }
      input {
        margin: 10px 0;
        padding: 5px;
      }
      button {
        padding: 5px 10px;
        background: #e94560;
        color: #fff;
        border: none;
        border-radius: 3px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Edit Score</h2>
      <form method="post">
        {% csrf_token %}
        <input
          type="number"
          name="ca_score"
          value="{{ score.ca_score }}"
          min="0"
          max="40"
          required
        />
        <input
          type="number"
          name="exam_score"
          value="{{ score.exam_score }}"
          min="0"
          max="60"
          required
        />
        <button type="submit">Save</button>
      </form>
      <a href="{% url 'teacher_home' %}">Back</a>
    </div>
  </body>
</html>
