{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - Result Management System</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWixZiN1O2wX2eW27Hg2VapzD9T0jYgJ3P0f/9z0B7a8e9b5x5k5g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      body {
        font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont,
          Roboto, sans-serif;
        background: linear-gradient(135deg, #d5e1e9, #a3bffa);
        margin: 0;
        padding: 1rem;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .dashboard {
        background-color: #ffffff;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        width: 100%;
        max-width: 1000px;
        text-align: center;
        animation: fadeIn 0.8s ease-out;
        position: relative;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1.5rem;
        margin: 0 auto 1.5rem;
      }

      .logo {
        max-width: 80px;
        height: auto;
      }

      h1 {
        color: #1a2a44;
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 1rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        border-bottom: 3px solid #f1c40f;
        display: inline-block;
        padding-bottom: 0.5rem;
      }

      .timestamp {
        font-size: 0.85rem;
        color: #7f8c8d;
        margin: 0 1rem;
        display: inline-block;
        vertical-align: middle;
      }

      .welcome {
        color: #2c3e50;
        font-size: 1.1rem;
        font-weight: 500;
        margin: 0 1rem;
        background-color: #f5f7fa;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        display: inline-block;
        vertical-align: middle;
      }

      .notification {
        background-color: #e74c3c;
        color: #ffffff;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        margin: 0 1rem;
        position: relative;
        animation: pulse 2s infinite;
        display: inline-block;
        cursor: pointer;
        vertical-align: middle;
      }

      .notification .close-btn {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        font-size: 0.9rem;
        cursor: pointer;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.02);
        }
        100% {
          transform: scale(1);
        }
      }

      .card-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1.5rem;
        padding: 0 1rem;
      }

      .card {
        background: linear-gradient(145deg, #ffffff, #f0f4f8);
        padding: 1.5rem;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        border-left: 4px solid #f1c40f;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        position: relative;
        overflow: hidden;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
      }

      .card.session-card:hover::after {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 2rem;
        color: #ffd700;
        animation: magicPortal 1s ease-out infinite;
        opacity: 0.8;
      }

      @keyframes magicPortal {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0);
        }
        50% {
          opacity: 0.8;
          transform: translate(-50%, -50%) scale(1.2);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0);
        }
      }

      .card i {
        color: #2980b9;
        font-size: 1.5rem;
      }

      .card form {
        width: 100%;
      }

      .card button {
        background: none;
        border: none;
        color: #2980b9;
        text-decoration: none;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        padding: 0;
        width: 100%;
        text-align: left;
        transition: color 0.3s ease;
      }

      .card button:hover {
        color: #1a5276;
      }

      .logout-btn {
        position: absolute;
        top: 1rem;
        right: 1rem;
        padding: 0.6rem 1.2rem;
        background: linear-gradient(45deg, #e74c3c, #c0392b);
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        box-shadow: 0 0 8px rgba(231, 76, 60, 0.5);
      }

      .logout-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 0 12px rgba(231, 76, 60, 0.7);
      }

      .footer {
        margin-top: 2rem;
        color: #7f8c8d;
        font-size: 0.85rem;
        font-weight: 400;
      }

      @media (max-width: 768px) {
        .dashboard {
          padding: 1.5rem;
        }
        .card-container {
          grid-template-columns: 1fr;
        }
        .card {
          width: 100%;
        }
        h1 {
          font-size: 1.8rem;
        }
        .welcome,
        .timestamp,
        .notification {
          font-size: 1rem;
          margin: 0 0.5rem;
        }
        .logout-btn {
          padding: 0.5rem 1rem;
          font-size: 0.9rem;
        }
        .logo-container {
          flex-direction: column;
          gap: 1rem;
        }
      }

      @media (max-width: 480px) {
        .dashboard {
          padding: 1rem;
        }
        h1 {
          font-size: 1.5rem;
        }
        .logo {
          max-width: 60px;
        }
        .welcome,
        .timestamp,
        .notification {
          font-size: 0.9rem;
          margin: 0 0.3rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard" role="main" aria-label="Admin Dashboard">
      <div class="logo-container">
        <img
          src="{% static 'images/school_logo.png' %}"
          alt="School Logo"
          class="logo"
        />
        <img
          src="{% static 'images/secondary_logo.png' %}"
          alt="Secondary Logo"
          class="logo"
        />
      </div>
      <h1>
        Admin Dashboard
        <span class="timestamp"
          >Last Updated: August 01, 2025 10:35 PM CEST</span
        >
        <span class="welcome" aria-live="polite"
          >Welcome, {{ user.username }}!</span
        >
        <span class="notification" id="notification" role="alert"
          >New updates available!
          <span
            class="close-btn"
            onclick="document.getElementById('notification').style.display='none'"
            >×</span
          ></span
        >
      </h1>
      <div class="card-container">
        <div class="card">
          <i class="fas fa-file-alt"></i>
          <form action="{% url 'results:generate_broadsheet' %}" method="get">
            <button type="submit" aria-label="Generate Broadsheet">
              Generate Broadsheet
            </button>
          </form>
        </div>
        <div class="card">
          <i class="fas fa-building"></i>
          <form action="{% url 'results:add_department' %}" method="get">
            <button type="submit" aria-label="Manage Section">Section</button>
          </form>
        </div>
        <div class="card">
          <i class="fas fa-chalkboard-teacher"></i>
          <form action="{% url 'results:add_teacher' %}" method="get">
            <button type="submit" aria-label="Manage Teacher">Teacher</button>
          </form>
        </div>
        <div class="card">
          <i class="fas fa-user-graduate"></i>
          <form action="{% url 'results:add_student' %}" method="get">
            <button type="submit" aria-label="Manage Student">Student</button>
          </form>
        </div>
        <div class="card">
          <i class="fas fa-school"></i>
          <form action="{% url 'results:add_class' %}" method="get">
            <button type="submit" aria-label="Manage Class">Class</button>
          </form>
        </div>
        <div class="card">
          <i class="fas fa-book"></i>
          <form action="{% url 'results:add_subject' %}" method="get">
            <button type="submit" aria-label="Manage Subject">Subject</button>
          </form>
        </div>
        <div class="card">
          <i class="fas fa-calendar-alt"></i>
          <form action="{% url 'results:add_term' %}" method="get">
            <button type="submit" aria-label="Manage Term">Term</button>
          </form>
        </div>
        <div class="card">
          <i class="fas fa-lock"></i>
          <form action="{% url 'results:lock_result' %}" method="get">
            <button type="submit" aria-label="Lock Result">Lock Result</button>
          </form>
        </div>
        <div class="card">
          <i class="fas fa-database"></i>
          <form action="{% url 'results:update_database' %}" method="get">
            <button type="submit" aria-label="Update Database">Database</button>
          </form>
        </div>
        <div class="card session-card">
          <i class="fas fa-clock"></i>
          <form action="{% url 'results:add_session' %}" method="get">
            <button type="submit" aria-label="Manage Session">Session</button>
          </form>
        </div>
      </div>
      <form
        action="{% url 'results:logout' %}"
        method="post"
        style="display: inline"
      >
        {% csrf_token %}
        <button type="submit" class="logout-btn" aria-label="Logout">
          Logout
        </button>
      </form>
      <div class="footer">
        © 2025 Result Management System. All rights reserved.
      </div>
    </div>
  </body>
</html>
