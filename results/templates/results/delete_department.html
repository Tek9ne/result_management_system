{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delete Department</title>
    <style>
      body {
        background-color: #1a1a2e;
        color: #ffd700;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 400px;
        margin: 50px auto;
        padding: 25px;
        background: #16213e;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      }
      .timestamp {
        font-size: 0.9rem;
        color: #ccc;
        margin-bottom: 15px;
        text-align: right;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
      }
      select {
        padding: 10px;
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #e94560;
        border-radius: 4px;
        background-color: #1a1a2e;
        color: #ffd700;
        font-size: 1rem;
        transition: border-color 0.3s ease;
      }
      select:focus {
        outline: none;
        border-color: #ff6f91;
        box-shadow: 0 0 5px rgba(255, 111, 145, 0.5);
      }
      button {
        padding: 10px 20px;
        background: #e94560;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.3s ease;
      }
      button:hover {
        background: #ff6f91;
      }
      a {
        display: block;
        margin-top: 15px;
        color: #ffd700;
        text-decoration: none;
        text-align: center;
      }
      a:hover {
        color: #ff6f91;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Delete Department</h2>
      <div class="timestamp">Last Updated: August 01, 2025 08:53 PM CEST</div>
      {% if error %}
      <p style="color: #ff6f91; margin-bottom: 15px">{{ error }}</p>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label for="department">Select Department to Delete:</label>
          <select name="department_id" id="department" required>
            <option value="">Select a Department</option>
            {% for dept in departments %}
            <option value="{{ dept.id }}">{{ dept.name }}</option>
            {% endfor %}
          </select>
        </div>
        <button
          type="submit"
          onclick="return confirm('Are you sure you want to delete this department? This action cannot be undone.');"
        >
          Delete Department
        </button>
      </form>
      <a href="{% url 'results:admin_dashboard' %}">Back</a>
    </div>
  </body>
</html>
